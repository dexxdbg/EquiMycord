name: Release
on:
    push:
        branches:
            - main

env:
    FORCE_COLOR: true
    GH_TOKEN: ${{ github.token }}
    GITHUB_TOKEN: ${{ github.token }}
    REPO: dexxdbg/my-badges
    USERNAME: GitHub-Actions

permissions:
    contents: write

jobs:
    Build:
        name: Build Equicord
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir release

                  cp browser/browser.* release
                  cp Equicord.user.{js,js.LEGAL.txt} release

                  # copy the plugin data jsons, the extension zips and the desktop/equibop asars
                  cp *.{json,zip,asar} release

                  # legacy un-asared files
                  cp desktop/* release
                  for file in equibop/*; do
                    filename=$(basename "$file")
                    cp "$file" "release/equibop${filename^}"
                  done

                  find release -size 0 -delete
                  rm release/package.json
                  rm release/*.map

            - name: Ensure latest release exists
              run: |
                  if ! gh release view latest >/dev/null 2>&1; then
                      gh release create latest \
                          --title "Equicord ${{ github.sha }}" \
                          --notes "Automated build for ${{ github.sha }}" \
                          --target ${{ github.sha }}
                  fi

            - name: Upload Equicord Stable
              run: |
                  gh release upload latest --clobber dist/release/*

            - name: Update release name to current commit
              # The auto-updater (src/main/updater/http.ts) compares the trailing
              # token of the release name against the baked-in git hash, so the
              # release title MUST end with the full commit SHA.
              run: |
                  gh release edit latest \
                      --title "Equicord ${{ github.sha }}" \
                      --target ${{ github.sha }}

            - name: Upload Plugin JSONs to Equibored repo
              if: github.repository == 'Equicord/Equicord' && vars.ACT == 'false'
              run: |
                  git config --global user.name "GitHub-Actions"
                  git config --global user.email actions@github.com
                  git clone https://$USERNAME:$GITHUB_TOKEN@github.com/$REPO.git plugins
                  cd plugins

                  cp ../dist/release/*plugins.json .
                  cp ../dist/release/devs.json .
                  git add -A

                  git commit -m "Plugins for https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
                  git push --force https://$USERNAME:$GITHUB_TOKEN@github.com/$REPO.git
